[package]
name = "clonfences"
version = "0.1.0"
edition = "2024"
description = "Organizador de escritorio para COSMIC inspirado en Stardock Fences"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
mime_guess = "2"
tokio = { version = "1", features = ["signal", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "e1f2cd2e52226aa50d59bb2cd6d43ffe290106ed"
default-features = false
features = ["tokio", "wayland", "winit", "multi-window", "dbus-config"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
